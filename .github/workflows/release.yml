name: Release

# Тег v0.2.0 → тесты → release APK → GitHub Release с файлом scanauto-0.2.0.apk.
# Ручной запуск (Actions → Release → Run workflow) собирает APK как артефакт без релиза.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Тесты
        run: |
          (cd packages/scan_core && dart test)
          (cd apps/mobile && flutter test)

      # Ключ — из секретов репозитория (docs/release.md). Без них — отладочный ключ.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > apps/mobile/android/key.properties
            echo "SIGNING=релизный ключ" >> "$GITHUB_ENV"
          else
            echo "::warning::Секретов подписи нет — APK подписан отладочным ключом"
            echo "SIGNING=отладочный ключ (для теста: перед установкой удалите прошлую версию)" >> "$GITHUB_ENV"
          fi

      - name: Версия
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Сборка APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release \
            --build-name="${VERSION%%-*}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VERSION"
          mv build/app/outputs/flutter-apk/app-release.apk "build/scanauto-$VERSION.apk"

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "apps/mobile/build/scanauto-$VERSION.apk" \
            --title "scanAuto $VERSION" \
            --notes "Сборка ${{ github.sha }}. Подпись: $SIGNING. Журналы сеансов: экран «Журналы сеансов» → «Поделиться»."

      - name: Артефакт
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: scanauto-${{ env.VERSION }}
          path: apps/mobile/build/scanauto-${{ env.VERSION }}.apk
