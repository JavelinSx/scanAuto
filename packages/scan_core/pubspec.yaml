name: scan_core
description: >-
  Протокол ELM327 / OBD-II, расшифровка PID и кодов неисправностей, симулятор адаптера,
  подготовка записи для языковой модели. Чистый Dart без Flutter: общий для приложения
  и будущего MCP-сервера.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  dio: ^5.11.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1  # не выше: flutter_test закрепляет test_api
